name: publish

on:
  # tagpr がリリース PR のマージ時に作る GitHub Release の公開をトリガーにする
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm Trusted Publishing (OIDC) + provenance 用

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run build
      # npm Trusted Publishing: NPM_TOKEN は使わない。npmjs.com 側で
      # @hakoniwajs/{core,node,cloudflare} それぞれの Trusted Publisher に
      # このリポジトリの publish.yml を登録しておくこと。
      # (npm CLI 11.5.1+ が必要。pnpm publish は内部で npm CLI を呼ぶため、
      #  mise の node が同梱する npm がその条件を満たす。新規パッケージの
      #  初回公開は trusted publishing 設定前なら token または手動 publish が必要)
      # 各パッケージの publishConfig.access = public。workspace:* 依存は実バージョンに書き換えられる。
      # 既に公開済みのバージョンがある場合は失敗するので、公開前に version を上げること。
      - run: pnpm -r publish --no-git-checks --access public
