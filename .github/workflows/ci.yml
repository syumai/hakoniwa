name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - run: pnpm install --frozen-lockfile
      # lint + check (fmt/lint/型) + test (Vitest) + build
      - run: pnpm run ci
      # packages/cloudflare のテストは workerd 上で動く別インスタンスのため集約実行に乗らない (development.md 参照)
      - run: pnpm --filter @hakoniwajs/cloudflare test
